<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tombol Geser Volume</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }

        /* Wadah utama untuk menyatukan tombol dan slider */
        .volume-box {
            display: flex;
            align-items: center;
            background-color: white;
            padding: 10px 15px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            gap: 10px;
        }

        /* Gaya untuk tombol utama */
        .btn-volume {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-volume:hover {
            background: #0056b3;
        }

        /* Gaya untuk garis dan bulatan geser (Slider) */
        .slider-volume {
            width: 0; /* Awalnya disembunyikan (lebar 0) */
            opacity: 0;
            cursor: pointer;
            transition: width 0.3s ease, opacity 0.3s ease; /* Efek animasi muncul halus */
            accent-color: #007bff; /* Mengubah warna bulatan dan garis aktif menjadi biru */
        }

        /* Class ini akan aktif saat tombol diklik melalui JavaScript */
        .slider-volume.tampil {
            width: 150px; /* Lebar garis setelah muncul */
            opacity: 1;
        }

        /* Teks indikator angka volume */
        .angka-volume {
            font-size: 14px;
            color: #333;
            min-width: 35px;
        }
    </style>
</head>
<body>

    <div class="volume-box">
        <!-- Tombol Utama -->
        <button class="btn-volume" onclick="toggleSlider()">🔊</button>
        
        <!-- Garis dengan Bulatan di Tengah yang Bisa Digeser -->
        <input type="range" class="slider-volume" id="myRange" min="0" max="100" value="50" oninput="updateVolume(this.value)">
        
        <!-- Indikator Angka -->
        <span class="angka-volume" id="volumeValue">50%</span>
    </div>

    <script>
        // Fungsi untuk memunculkan / menyembunyikan garis geser saat tombol diklik
        function toggleSlider() {
            const slider = document.getElementById("myRange");
            slider.classList.toggle("tampil");
        }

        // Fungsi untuk memperbarui angka saat bulatan digeser dari kecil ke besar
        function updateVolume(nilai) {
            const teksAngka = document.getElementById("volumeValue");
            teksAngka.innerText = nilai + "%";
        }
    </script>

</body>
</html>
