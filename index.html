<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Growtopia World Planner</title>
    <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
    <div id="app">
        <header id="toolbar">
            <div class="brand">Growtopia World Planner</div>
            <div class="tools">
                <button data-tool="place-fg" class="tool active" title="Place Foreground (B)" aria-label="Place Foreground">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
                </button>
                <button data-tool="place-bg" class="tool" title="Place Background (V)" aria-label="Place Background">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/><rect x="5" y="5" width="4" height="4" rx="1" opacity="0.5"/><rect x="15" y="15" width="4" height="4" rx="1" opacity="0.5"/></svg>
                </button>
                <button data-tool="erase" class="tool" title="Erase (E)" aria-label="Erase">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7"/><path d="M14 2v4a2 2 0 0 1-2 2H4"/><path d="M9 10v9"/><path d="M15 10v9"/><path d="M4 18h16"/><path d="M18 2a2 2 0 0 1 2 2v12c0 .6-.2 1.1-.5 1.5L6 8.5 4 16"/></svg>
                </button>
                <button data-tool="fill" class="tool" title="Fill (F)" aria-label="Fill">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 11v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M21 10V5a2 2 0 0 0-2-2h-4"/><path d="M3 16v-4a2 2 0 0 1 2-2h14"/><path d="M17 8h2a2 2 0 0 1 2 2v4"/></svg>
                </button>
                <button data-tool="pick" class="tool" title="Eyedropper (I)" aria-label="Eyedropper">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="M4.93 19.07l2.83-2.83"/><path d="M16.24 7.76l2.83-2.83"/></svg>
                </button>
            </div>
            <div class="actions" id="erase-options" style="display: none; align-items: center; gap: 8px;">
                <label class="chk" title="Hapus Foreground"><input type="checkbox" id="erase-fg" checked /><span class="chk-box"></span> FG</label>
                <label class="chk" title="Hapus Background"><input type="checkbox" id="erase-bg" checked /><span class="chk-box"></span> BG</label>
            </div>
            <div class="actions">
                <button id="btn-undo" title="Undo (Ctrl+Z)">Undo</button>
                <button id="btn-redo" title="Redo (Ctrl+Y)">Redo</button>
                <label class="chk brush" title="Ukuran brush (1-16)">
                    Brush <span id="brush-val">1</span>
                    <input type="range" id="brush-size" min="1" max="16" step="1" value="1" />
                </label>
                <label class="chk"><input type="checkbox" id="chk-grid" checked /><span class="chk-box"></span> Grid</label>
                <label class="chk" title="Bedrock default di 7 baris terbawah world"><input type="checkbox" id="chk-bedrock" checked /><span class="chk-box"></span> Bedrock</label>
                <label class="chk" title="Kunci tile yang sudah punya desain (FG/BG) agar tidak tertimpa"><input type="checkbox" id="chk-lock-tiles" /><span class="chk-box"></span> Lock</label>
                <label class="chk" title="Tampilkan Foreground"><input type="checkbox" id="chk-show-fg" checked /><span class="chk-box"></span> FG</label>
                <label class="chk" title="Tampilkan Background"><input type="checkbox" id="chk-show-bg" checked /><span class="chk-box"></span> BG</label>
                <button id="btn-fit" title="Fit world to screen (0)">Fit</button>
                <span class="zoom-label" id="zoom-label">100%</span>
            </div>
            <div class="actions">
                <button id="btn-clear">Clear</button>
                <button id="btn-import">Import</button>
                <button id="btn-export" class="primary">Export</button>
                <input type="file" id="file-import" accept=".json,application/json" hidden />
            </div>
            <div class="world-name">
                <span>World:</span>
                <input id="world-name" value="START" maxlength="24" />
            </div>
        </header>
        <main id="main">
            <aside id="sidebar-left">
                <input id="item-search" type="text" placeholder="Search item / ID... (min 2 char)" autocomplete="off" />
                <div id="item-stats"></div>
                <div id="item-list"></div>
                <div id="item-status">Loading items...</div>
            </aside>
            <section id="canvas-wrap">
                <canvas id="world-canvas"></canvas>
                <div id="canvas-toast"></div>
                <div id="cursor-info"></div>
            </section>
            <aside id="sidebar-right">
                <div class="sidebar-section">
                    <h3>Selected</h3>
                    <div id="selected-item" class="sel-box">
                        <canvas width="32" height="32"></canvas>
                        <div>
                            <div id="sel-name">-</div>
                            <div id="sel-id">-</div>
                        </div>
                    </div>
                </div>
                <div class="sidebar-section">
                    <h3>Ukuran World</h3>
                    <div class="size-controls">
                        <label title="Lebar world (tile)">W<input type="number" id="world-w" min="1" max="200" step="1" value="100" /></label>
                        <span class="size-x">×</span>
                        <label title="Tinggi world (tile)">H<input type="number" id="world-h" min="1" max="120" step="1" value="60" /></label>
                        <button id="btn-resize" title="Terapkan ukuran world (default 100x60, maks 200x120)">Terapkan</button>
                    </div>
                    <div class="row"><span>maks</span><b>200 × 120</b></div>
                    <div class="row"><span>default</span><b>100 × 60</b></div>
                </div>
                <div class="sidebar-section">
                    <h3>Latar Weather</h3>
                    <select id="weather-select" title="Background weather Growtopia dari cache"></select>
                    <label class="chk" title="Pakai background weather asli dari cache, bukan kotak-kotak"><input type="checkbox" id="chk-weather-bg" checked /><span class="chk-box"></span> Aktif</label>
                </div>
                <div class="sidebar-section">
                    <h3>Tile</h3>
                    <div id="tile-props">
                        <div class="row"><span>x</span><b id="tp-x">-</b></div>
                        <div class="row"><span>y</span><b id="tp-y">-</b></div>
                        <div class="row"><span>foreground</span><b id="tp-fg">-</b></div>
                        <div class="row"><span>background</span><b id="tp-bg">-</b></div>
                        <div class="row"><span>index</span><b id="tp-idx">-</b></div>
                    </div>
                    <div class="row"><span>ukuran</span><b id="tp-size">100 × 60</b></div>
                    <div class="row"><span>tiles</span><b id="tp-tiles">6000</b></div>
                    <div class="row"><span>format</span><b>GTPS3 JSON</b></div>
                </div>
                <div id="status-msg"></div>
            </aside>
        </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
