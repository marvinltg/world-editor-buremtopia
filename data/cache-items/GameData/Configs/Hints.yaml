Hints:
- Id: wolf
  DisplayName: Wolf Worlds
  Icon: ITEM_ID_WOLF_WHISTLE
  Banner: interface/large/gui_event_wolfworld.rttex
  Info: |
    - Get a `2Wolf Whistle``.
    - Consume the `2Wolf Whistle`` to face the wolf world parkour challenge.
    - Reach the Great Wolf Totem at the end of the parkour challenge within the time limit to get your prize.
- Id: fishing
  Icon: ITEM_ID_FISHING_ROD
  DisplayName: Fishing
  Banner: interface/large/gui_event_fishing.rttex
  Info: |
    - Get a `2Fishing Rod``, some `2Bait`` and a `2Water Bucket``.
    - Dig a hole in the ground and fill it with water.
    - Equip the `2Fishing Rod`` and then stand beside the water and consume the `2Bait`` on the `2Water``.
    - Wait for a fish to bite (indicated by a splash).
    - Punch the water tile as soon as you see the splash to catch a fish.
- Id: surgery
  Icon: ITEM_ID_SURG_E
  DisplayName: Surgery
  Banner: interface/large/gui_event_surgery_info.rttex
  Info: |
    - Buy `2Surgery Tools`` from the store in the `5Surgical Kit`` or `5Master Surgeon's Tool Bag`` packs.
    - Wrench a `2Growtopian`` that is sleeping on a `2Hospital Bed`` or a `2Surg-E`` bot.
    - Perform surgery on them.
    - Successfully fix the illness they have to get your prize.
- Id: crime
  Icon: ITEM_ID_HENCHMAN
  DisplayName: Crime Fighting
  Banner: interface/large/gui_event_crimewave.rttex
  Info: |
    - Buy `2Superpower Cards`` from the store in the `5Crime Wave`` pack.
    - Consume the `2Crime Wave`` to spawn villains to fight.
    - Punch a villain to start a Card Battle with them.
    - Successfully defeat the villain to get your prize.
- Id: startopia
  Icon: ITEM_ID_STARSHIP_BLAST_CLASS_1
  DisplayName: Startopia
  Banner: interface/large/gui_event_imperialstarship.rttex
  Info: |
    - Buy an `2Imperial Starship Blast`` from the store and consume it to make a starship world.
    - Buy an `2Startools`` from the store in the `2Galactic Goodies`` pack.
    - Wrench the `2Helm`` of your starship to start a star mission.
    - Successfully complete the mission to get your prize.
- Id: mines
  Icon: ITEM_ID_CAVE_BLAST
  DisplayName: Mines
  Banner: interface/large/gui_event_mining.rttex
  Info: |
    - Buy a `2Cave Blast`` from the store and consume it to make a cave world.
    - Search the cave for a hidden entrance to the ancient mine.
    - Use the Mining Explosives to break the Magic Infused Veins.
    - Find the Pure Magic Ore inside the Magic Infused Veins to get your prize.
- Id: geiger
  Icon: ITEM_ID_GEIGER_COUNTER
  DisplayName: Geiger Hunting
  Banner: interface/large/gui_event_geigar.rttex
  Info: |
    - Buy a `2Geiger Counter`` from the store and equip it.
    - Hunt around the world until the pulses turn green and increase in speed.
    - Slowly move around the area until you find your prize.
- Id: Winter_Wish
  Icon: ITEM_ID_WINTER_WISH_BOX
  Info: |
    - Earn a `2Winter Wish`` from the Winter Wish List.
    - Consume the `2Winter Wish`` to get your prize.
- Id: Special_Winter_Wish
  Icon: ITEM_ID_SUPER_CRACKER
  Info: |
    - Buy a `2Special Winter Wish`` from the Winter Wish List.
    - Consume the `2Special Winter Wish`` to get your prize.
- Id: Winterfest_Cracker
  Icon: ITEM_ID_WINTERFEST_CRACKER
  Info: |
    - Buy a `2Winterfest Cracker`` from the store.
    - Find a friend.
    - Consume the `2Winterfest Cracker`` with your friend to get your prize.
- Id: Deluxe_Cracker
  Icon: ITEM_ID_DELUXE_WINTERFEST_CRACKER
  Info: |
    - Buy a `2Deluxe Winterfest Cracker`` from the store.
    - Find a friend.
    - Consume the `2Deluxe Winterfest Cracker`` with your friend to get your prize.
- Id: Calendar
  Icon: ITEM_ID_WINTERFEST_CALENDAR_2025
  Info: |
    - Buy a `2Winterfest Calendar - 2025`` from the store.
    - Build the `2Winterfest Calendar - 2025`` in your world.
    - Punch the `2Winterfest Calendar - 2025`` to retrieve your prize.

    - `6NOTE: The Winterfest Calendar - 2025 is currently sold out!``
- Id: Diamond_Provider
  Icon: ITEM_ID_DIAMOND_BLOCKS_MACHINE
  Info: |
    - Buy a `2Diamond Builders Bonanza`` from the store on Saturdays.
    - Build the `2Diamond Builders Bonanza`` in your world.
    - Punch the `2Diamond Builders Bonanza`` to retrieve your prize.
- Id: Giving_Tree
  Icon: ITEM_ID_GIVING_TREE
  Info: |
    - Cut down a `2Giving Tree`` with a `5Lumber Axe`` in the world GROWCH.
    - Plant the `2Giving Tree`` in your own world and decorate it with `5Tree Decorations``.
    - Wait for a present to appear under the `2Giving Tree``.
    - Punch the `2Giving Tree`` to retrieve your prize.
- Id: Splice_1
  Icon: ITEM_ID_SNOWY_ROCKS
  Info: |
    - Splice together a `5Rock Seed`` and an `5Ice Seed``.
    - Wait until the tree is fully grown and then punch the tree to Harvest it.
