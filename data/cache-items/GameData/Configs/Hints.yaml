- Id: set_home
  DisplayName: Set Home
  Icon: ITEM_ID_WORLD_LOCK
  Info: |
    You can set any world you own as your `2Home World`` by wrenching the world lock.

    - Wrench the world lock.
    - Press the "Set as Home World" button.
- Id: return_home
  DisplayName: Return Home
  Icon: ITEM_ID_CAMERA_LOG_ENTER
  Info: |
    You can return to your `2Home World`` at any time:

    - From the world select screen by pressing the HOME button.
    - From the chat console by typing the command "/home".
- Id: welcome
  Info: |
    Welcome to Growtopia, a place where you can be anyone and do anything you could imagine.
- Id: punch
  DisplayName: Punch
  Icon: ITEM_ID_FIST
  Info: |
    In Growtopia you can break almost anything with your `2Fist``!

    - Select your `2Fist`` from the inventory at the bottom of the screen.
    - With the `2Fist``, tap on any tile to punch it.
    - Punch a tile repeatedly to break it.

    By breaking blocks you can get all sorts of goodies including seeds, blocks and even gems.
- Id: build
  DisplayName: Build
  Icon: ITEM_ID_DIRT
  Info: |
    In Growtopia you can build with the blocks you find and grow to be creative!

    - Select a `2Block`` from the inventory at the bottom of the screen.
    - With the `2Block`` selected, tap on any empty tile to build it in the world.

    By breaking blocks you can collect seeds to grow more of the same block or to splice those seeds with other seeds to create new things.
- Id: grow
  DisplayName: Grow
  Icon: ITEM_ID_DIRT_SEED
  Info: |
    In Growtopia almost everything grows from `2Seeds``! Seeds can be found by breaking blocks.

    - Select a `2Seed`` from the inventory at the bottom of the screen.
    - With the `2Seed`` selected, tap on any empty tile to plant it in the world.

    Remeber that seeds can't grow in mid air so you need to plant them on top of another block.
- Id: seed_diary_discover
  DisplayName: Discovered
  Icon: ITEM_ID_MYSTERY_BLOCK
  Info: |
    - Every time you collect a block or seed the item will be logged in your Seed Diary as discovered.

    You can use the blocks that you have already discovered to see what possible seed combinations you might be able to use to create even more new blocks.
- Id: seed_diary_plant
  DisplayName: Planted
  Icon: ITEM_ID_UNKNOWN_SEED_ICON
  Info: |
    - An item will only be logged as planted after you plant or splice the seed for the item.
- Id: splice
  DisplayName: Splicing
  Icon: ITEM_ID_UNKNOWN_SEED_ICON
  Info: |
    New `2Seeds`` can be discovered by `2Splicing`` 2 Seeds together!

    - Select a `2Seed`` from the inventory.
    - With the `2Seed`` selected, tap on any empty tile to plant it in the world.
    - Select second `2Seed`` from the inventory.
    - With the `2Seed`` selected, tap on the previously planted seed to splice the 2 seeds together.
- Id: farming
  DisplayName: Farming
  Icon: ITEM_ID_PEPPER_TREE
  Info: |
    You can get more seeds for an item by `2Farming`` the seeds.

    1. Planting the seeds.
    2. Harvest the blocks from the tree once its fully grown.
    3. Build the blocks into the world.
    4. Break the blocks to get more seeds.

    Repeat the previous 4 steps.

    Not every seed will give enough blocks to get more seeds by farming the seeds directly. If a tree can give 6 or more blocks then it is considered `2farmable`` and you will be able to get more seeds by repeating this loop.
    If the block is not farmable you may need to farm other blocks and splice their seeds to get more of the block or seed that you want.
- Id: shop
  DisplayName: The Shop
  Icon: ITEM_ID_FOR_SALE_SIGN
  Info: |
    In Growtopia many things can be purchased in the shop with the `2Gems`` you find as well and `2Growtokens`` and `2GrowVouchers``.

    Player Items - Cosmetic itmes and upgrades to you backpack.
    World Building - Items for building and decorating your world.
    Activities - Everything you need to be anything you like.
    Creativity - Express yourself with items your creative flair.
- Id: wrench
  DisplayName: Wrench
  Icon: ITEM_ID_WRENCH
  Info: |
    The wrench can be used to change the settings and parameters of many blocks in the game.

    - Select a `2Wrench`` from the inventory.
    - With the `2Wrench`` selected, tap on any block that displays the wrench icon over the tile.

    You can also use the wrench to view the information about other players.

    - Select a `2Wrench`` from the inventory.
    - With the `2Wrench`` selected, tap on the wrench icon beside a players name.
